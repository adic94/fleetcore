# Środowisko lokalne programisty (docs/03, „Środowiska": local). Dane wyłącznie syntetyczne.
# Produkcyjnie baza i magazyn plików są usługami zarządzanymi POZA klastrem (docs/08).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: fleetcore
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localdev
      MINIO_ROOT_PASSWORD: localdev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  ocr:
    build: ./apps/ocr
    ports: ["8000:8000"]
    profiles: ["ocr"]

volumes:
  pgdata:
  miniodata:
